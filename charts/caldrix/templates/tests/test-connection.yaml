{{- if .Values.tests.enabled }}
{{- $url := printf "http://%s:%v" (include "caldrix.fullname" .) .Values.service.port }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "caldrix.fullname" . }}-test-connection
  labels:
    {{- include "caldrix.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: curl
      image: {{ .Values.tests.image | quote }}
      command:
        - sh
        - -c
        - {{ printf "curl -fsS %s/healthz && curl -fsS %s/v1/models" $url $url | quote }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
{{- end }}

name: Bug report
description: Something in a chart does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: helm-version
    attributes:
      label: helm version
      render: text
    validations:
      required: true
  - type: textarea
    id: kubectl-version
    attributes:
      label: kubectl version
      render: text
    validations:
      required: true
  - type: input
    id: chart-version
    attributes:
      label: The chart version
    validations:
      required: true
  - type: textarea
    id: values
    attributes:
      label: helm get values <release>, with secrets removed
      render: yaml
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: The pod's logs
      render: text
    validations:
      required: true
